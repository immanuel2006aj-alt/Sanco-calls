<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sanco Calls – Private ID Voice</title>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS for signaling -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>
<body>

    <!-- Toast notification -->
    <div id="toast" class="toast"></div>

    <!-- Main App -->
    <div class="app" id="app">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <!-- SVG icon inline for fast load -->
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
                Sanco Calls
            </div>
            <div class="status-badge" id="statusBadge">● Ready</div>
        </div>

        <!-- Role Toggle -->
        <div class="role-toggle" id="roleToggle">
            <button class="active" data-role="caller">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                Caller
            </button>
            <button data-role="receiver">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                Receiver
            </button>
        </div>

        <!-- Caller Panel -->
        <div id="callerPanel" class="panel fade-in">
            <div class="panel-title">📤 Generate Call ID</div>
            <button class="btn primary" id="generateIdBtn" style="width:100%;">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                Generate Call ID
            </button>
            <div id="callerIdBox" class="call-id-box hidden">
                <span id="generatedIdDisplay">—</span>
                <button class="copy-btn" id="copyIdBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    Copy
                </button>
            </div>
            <div id="callerStatus" style="margin-top:10px; font-size:14px; color:#8899bb; text-align:center;">Press generate to start</div>
            <div id="callerControls" class="hidden">
                <div class="call-controls">
                    <button class="btn success" id="callerMicBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                        ON
                    </button>
                    <button class="btn danger" id="callerEndBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                            <line x1="12" y1="2" x2="12" y2="12"/>
                        </svg>
                        End
                    </button>
                </div>
            </div>
        </div>

        <!-- Receiver Panel -->
        <div id="receiverPanel" class="panel fade-in hidden">
            <div class="panel-title">📥 Enter Call ID</div>
            <div class="input-group">
                <input type="text" id="receiverInput" placeholder="Paste Call ID..." />
                <button class="btn primary" id="connectBtn">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h13M12 5l7 7-7 7"/>
                    </svg>
                    Connect
                </button>
            </div>
            <div id="receiverStatus" style="font-size:14px; color:#8899bb; text-align:center;">Enter an ID and connect</div>
            <div id="receiverControls" class="hidden">
                <div class="call-controls">
                    <button class="btn success" id="receiverMicBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                            <line x1="12" y1="19" x2="12" y2="23"/>
                            <line x1="8" y1="23" x2="16" y2="23"/>
                        </svg>
                        ON
                    </button>
                    <button class="btn danger" id="receiverEndBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                            <line x1="12" y1="2" x2="12" y2="12"/>
                        </svg>
                        End
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- External JavaScript (minified/obfuscated) -->
    <script src="script.js"></script>
</body>
</html>
