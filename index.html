<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Sanco Calls – Private ID Voice</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:radial-gradient(circle at 20% 30%,#0b1120,#03050b);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#e8edf5}
        .app{max-width:480px;width:100%;background:rgba(18,28,46,.65);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:48px;padding:28px 24px;box-shadow:0 20px 60px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.04)}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
        .logo{font-weight:700;font-size:22px;background:linear-gradient(135deg,#7ecfff,#5b7cfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:8px}
        .logo svg{width:28px;height:28px;fill:none;stroke:#7ecfff;stroke-width:2}
        .status-badge{font-size:12px;padding:6px 16px;border-radius:40px;background:rgba(255,70,70,.15);border:1px solid rgba(255,70,70,.25);color:#ff6b6b;font-weight:600;text-transform:uppercase;transition:all .3s}
        .status-badge.online{background:rgba(70,255,150,.12);border-color:rgba(70,255,150,.25);color:#5affa0}
        .status-badge.connecting{background:rgba(255,200,50,.12);border-color:rgba(255,200,50,.25);color:#ffd93d}
        .status-badge.connected{background:rgba(50,200,255,.15);border-color:rgba(50,200,255,.3);color:#5fcfff}
        .panel{background:rgba(0,0,0,.25);border-radius:32px;padding:24px 20px;border:1px solid rgba(255,255,255,.04);margin-bottom:20px}
        .panel-title{font-size:13px;font-weight:600;letter-spacing:1px;color:#8899bb;margin-bottom:16px;text-transform:uppercase}
        .role-toggle{display:flex;background:rgba(0,0,0,.3);border-radius:40px;padding:4px;margin-bottom:24px;border:1px solid rgba(255,255,255,.05)}
        .role-toggle button{flex:1;border:none;background:transparent;padding:10px;border-radius:40px;font-weight:600;font-size:14px;color:#8899bb;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:6px}
        .role-toggle button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
        .role-toggle button.active{background:linear-gradient(135deg,#3b82f6,#7c3aed);color:#fff;box-shadow:0 4px 20px rgba(59,130,246,.25)}
        .input-group{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
        .input-group input{flex:1;padding:14px 18px;border-radius:60px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.35);color:#fff;font-size:16px;outline:none;min-width:140px;font-family:inherit}
        .input-group input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.15)}
        .input-group input::placeholder{color:#556688}
        .btn{padding:14px 28px;border:none;border-radius:60px;font-weight:700;font-size:15px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.06);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;flex:1 0 auto}
        .btn:active{transform:scale(.94)}
        .btn.primary{background:linear-gradient(135deg,#3b82f6,#7c3aed);border-color:transparent;box-shadow:0 4px 20px rgba(59,130,246,.25)}
        .btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c);box-shadow:0 4px 20px rgba(239,68,68,.2)}
        .btn.success{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 20px rgba(34,197,94,.2)}
        .btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2}
        .call-id-box{background:rgba(0,0,0,.3);border-radius:60px;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 16px;border:1px solid rgba(255,255,255,.05)}
        .call-id-box span{font-family:'Courier New',monospace;font-weight:700;font-size:18px;color:#7ecfff;word-break:break-all}
        .call-id-box .copy-btn{background:rgba(255,255,255,.05);border:none;border-radius:40px;padding:8px 16px;color:#aabccc;font-size:13px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:4px}
        .call-id-box .copy-btn:hover{background:rgba(255,255,255,.1);color:#fff}
        .call-controls{display:flex;justify-content:center;gap:16px;margin-top:16px}
        .call-controls .btn{flex:0 1 auto;min-width:80px}
        .hidden{display:none!important}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);backdrop-filter:blur(10px);padding:12px 28px;border-radius:60px;border:1px solid rgba(255,255,255,.06);color:#e0e8f0;font-size:14px;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s;max-width:90%;text-align:center}
        .toast.show{opacity:1}
        @media(max-width:420px){.app{padding:20px 16px;border-radius:32px}.panel{padding:18px 14px}.btn{font-size:14px;padding:12px 20px;min-height:48px}.call-id-box span{font-size:15px}}
    </style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="app" id="app">
    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            Sanco Calls
        </div>
        <div class="status-badge" id="statusBadge">● Ready</div>
    </div>
    <div class="role-toggle" id="roleToggle">
        <button class="active" data-role="caller">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Caller
        </button>
        <button data-role="receiver">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.574 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            Receiver
        </button>
    </div>

    <!-- Caller -->
    <div id="callerPanel" class="panel">
        <div class="panel-title">📤 Generate Call ID</div>
        <button class="btn primary" id="generateIdBtn" style="width:100%;">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            Generate Call ID
        </button>
        <div id="callerIdBox" class="call-id-box hidden">
            <span id="generatedIdDisplay">—</span>
            <button class="copy-btn" id="copyIdBtn">
                <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                Copy
            </button>
        </div>
        <div id="callerStatus" style="margin-top:10px;font-size:14px;color:#8899bb;text-align:center;">Press generate to start</div>
        <div id="callerControls" class="hidden">
            <div class="call-controls">
                <button class="btn success" id="callerMicBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    ON
                </button>
                <button class="btn danger" id="callerEndBtn">
                    <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                    End
                </button>
            </div>
        </div>
    </div>

    <!-- Receiver -->
    <div id="receiverPanel" class="panel hidden">
        <div class="panel-title">📥 Enter Call ID</div>
        <div class="input-group">
            <input type="text" id="receiverInput" placeholder="Paste Call ID..." />
            <button class="btn primary" id="connectBtn">
                <svg viewBox="0 0 24 24"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
                Connect
            </button>
        </div>
        <div id="receiverStatus" style="font-size:14px;color:#8899bb;text-align:center;">Enter an ID and connect</div>
        <div id="receiverControls" class="hidden">
            <div class="call-controls">
                <button class="btn success" id="receiverMicBtn">
                    <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                    ON
                </button>
                <button class="btn danger" id="receiverEndBtn">
                    <svg viewBox="0 0 24 24"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/></svg>
                    End
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // DOM refs
        const statusBadge = document.getElementById('statusBadge');
        const generateBtn = document.getElementById('generateIdBtn');
        const callerIdBox = document.getElementById('callerIdBox');
        const generatedIdDisplay = document.getElementById('generatedIdDisplay');
        const copyIdBtn = document.getElementById('copyIdBtn');
        const callerStatus = document.getElementById('callerStatus');
        const callerControls = document.getElementById('callerControls');
        const callerMicBtn = document.getElementById('callerMicBtn');
        const callerEndBtn = document.getElementById('callerEndBtn');
        const receiverPanel = document.getElementById('receiverPanel');
        const callerPanel = document.getElementById('callerPanel');
        const receiverInput = document.getElementById('receiverInput');
        const connectBtn = document.getElementById('connectBtn');
        const receiverStatus = document.getElementById('receiverStatus');
        const receiverControls = document.getElementById('receiverControls');
        const receiverMicBtn = document.getElementById('receiverMicBtn');
        const receiverEndBtn = document.getElementById('receiverEndBtn');
        const toast = document.getElementById('toast');

        let peer = null;
        let myId = null;
        let currentRoom = null;
        let localStream = null;
        let isMicOn = false;
        let isInCall = false;
        let isCaller = true;
        let peerCalls = new Map();
        let dataConns = new Map();

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function setStatus(text, type) {
            statusBadge.textContent = text;
            statusBadge.className = 'status-badge';
            if (type) statusBadge.classList.add(type);
        }

        async function startLocalAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, sampleRate: 16000, sampleSize: 16, channelCount: 1 }
                });
                localStream = stream;
                isMicOn = true;
                callerMicBtn.textContent = 'ON';
                callerMicBtn.className = 'btn success';
                receiverMicBtn.textContent = 'ON';
                receiverMicBtn.className = 'btn success';
                return stream;
            } catch (err) {
                showToast('❌ Microphone access denied.');
                console.error(err);
                return null;
            }
        }

        function hangUp() {
            for (let [id, call] of peerCalls) { call.close(); }
            peerCalls.clear();
            for (let [id, conn] of dataConns) { conn.close(); }
            dataConns.clear();
            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }
            isMicOn = false;
            isInCall = false;
            currentRoom = null;
            if (isCaller) {
                callerControls.classList.add('hidden');
                callerStatus.textContent = 'Waiting for receiver...';
                setStatus('Waiting', 'connecting');
            } else {
                receiverControls.classList.add('hidden');
                receiverStatus.textContent = 'Enter ID and connect';
                setStatus('Ready', '');
            }
            showToast('Call ended.');
        }

        function toggleMic(button) {
            if (!localStream) {
                startLocalAudio().then(() => {
                    isMicOn = true;
                    button.textContent = 'ON';
                    button.className = 'btn success';
                });
                return;
            }
            isMicOn = !isMicOn;
            localStream.getAudioTracks().forEach(t => t.enabled = isMicOn);
            button.textContent = isMicOn ? 'ON' : 'OFF';
            button.className = isMicOn ? 'btn success' : 'btn danger';
        }

        function handleCall(call) {
            call.on('stream', (remoteStream) => {
                const audioEl = document.createElement('audio');
                audioEl.srcObject = remoteStream;
                audioEl.autoplay = true;
                audioEl.controls = false;
                audioEl.style.display = 'none';
                document.body.appendChild(audioEl);
                if (!call._audioEl) call._audioEl = audioEl;
                if (!isCaller) {
                    receiverControls.classList.remove('hidden');
                    receiverStatus.textContent = '📞 Connected – Talk!';
                    setStatus('Connected', 'connected');
                    isInCall = true;
                    showToast('📞 Connected to caller!');
                }
            });
            call.on('close', () => { hangUp(); });
            peerCalls.set(call.peer, call);
        }

        async function generateId() {
            if (isInCall) hangUp();
            try {
                if (peer && !peer.destroyed) peer.destroy();
                peer = new Peer();
                await new Promise((resolve, reject) => {
                    peer.on('open', (id) => { myId = id; setStatus('Online', 'online'); resolve(); });
                    peer.on('error', reject);
                });
                const roomId = Math.random().toString(36).substring(2, 10);
                currentRoom = roomId;
                generatedIdDisplay.textContent = roomId;
                callerIdBox.classList.remove('hidden');
                callerStatus.textContent = '🔗 ID generated. Share with receiver.';
                setStatus('Waiting', 'connecting');
                showToast('Call ID: ' + roomId + ' – share it!');

                peer.on('connection', (conn) => {
                    conn.on('data', (data) => {
                        if (data.type === 'join') {
                            const receiverId = data.peerId;
                            if (localStream) {
                                const call = peer.call(receiverId, localStream);
                                handleCall(call);
                            } else {
                                startLocalAudio().then(stream => {
                                    if (stream) {
                                        const call = peer.call(receiverId, stream);
                                        handleCall(call);
                                    }
                                });
                            }
                            callerControls.classList.remove('hidden');
                            callerStatus.textContent = '📞 Connected – Talk!';
                            setStatus('Connected', 'connected');
                            isInCall = true;
                            showToast('📞 Receiver connected!');
                        }
                    });
                    dataConns.set(conn.peer, conn);
                });

                peer.on('call', (call) => {
                    if (localStream) call.answer(localStream);
                    else startLocalAudio().then(stream => { if (stream) call.answer(stream); else call.close(); });
                    handleCall(call);
                });

                if (!localStream) await startLocalAudio();

            } catch (err) {
                showToast('❌ Failed: ' + err.message);
                console.error(err);
            }
        }

        async function connectToCaller() {
            const roomId = receiverInput.value.trim();
            if (!roomId) { showToast('Please enter a Call ID.'); return; }
            if (isInCall) hangUp();
            try {
                if (peer && !peer.destroyed) peer.destroy();
                peer = new Peer();
                await new Promise((resolve, reject) => {
                    peer.on('open', (id) => { myId = id; setStatus('Online', 'online'); resolve(); });
                    peer.on('error', reject);
                });
                currentRoom = roomId;
                receiverStatus.textContent = 'Connecting...';
                setStatus('Connecting', 'connecting');

                const conn = peer.connect(roomId, { reliable: true });
                conn.on('open', () => {
                    conn.send({ type: 'join', peerId: myId });
                    peer.on('call', (call) => {
                        if (localStream) call.answer(localStream);
                        else startLocalAudio().then(stream => { if (stream) call.answer(stream); else call.close(); });
                        handleCall(call);
                    });
                    if (!localStream) startLocalAudio();
                });
                conn.on('error', (err) => {
                    showToast('❌ Connection failed: ' + err.message);
                    console.error(err);
                    receiverStatus.textContent = 'Connection failed';
                    setStatus('Ready', '');
                });
                dataConns.set(roomId, conn);

            } catch (err) {
                showToast('❌ Error: ' + err.message);
                console.error(err);
                receiverStatus.textContent = 'Connection failed';
                setStatus('Ready', '');
            }
        }

        // Role toggle
        document.querySelectorAll('.role-toggle button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.role-toggle button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                isCaller = this.dataset.role === 'caller';
                if (isCaller) {
                    callerPanel.classList.remove('hidden');
                    receiverPanel.classList.add('hidden');
                } else {
                    callerPanel.classList.add('hidden');
                    receiverPanel.classList.remove('hidden');
                }
                if (isInCall) hangUp();
            });
        });

        // Event listeners
        generateBtn.addEventListener('click', generateId);
        connectBtn.addEventListener('click', connectToCaller);
        callerMicBtn.addEventListener('click', function() { toggleMic(this); });
        receiverMicBtn.addEventListener('click', function() { toggleMic(this); });
        callerEndBtn.addEventListener('click', hangUp);
        receiverEndBtn.addEventListener('click', hangUp);

        copyIdBtn.addEventListener('click', function() {
            const id = generatedIdDisplay.textContent;
            if (id && id !== '—') {
                navigator.clipboard?.writeText(id).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = id;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                });
                showToast('✅ Copied!');
            }
        });

        // Anti‑copy
        if (window.location.protocol === 'file:') {
            document.body.innerHTML = '<div style="color:red;padding:40px;text-align:center;font-size:20px;">⚠️ Must be served from a web server.</div>';
            throw new Error('Invalid origin');
        }
        if (window.top !== window.self) {
            document.body.innerHTML = '<div style="color:red;padding:40px;text-align:center;">🚫 Unauthorized embedding.</div>';
            throw new Error('Iframe');
        }

        // Initial state
        setStatus('Ready', '');
        callerPanel.classList.remove('hidden');
        receiverPanel.classList.add('hidden');

        window.addEventListener('beforeunload', () => { if (isInCall) hangUp(); });

        console.log('Sanco Calls ready.');
    })();
</script>
</body>
</html>
